```yaml
name: FL Royale Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK components
        shell: pwsh
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;36.1.0"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements-build.txt) {
            pip install -r requirements-build.txt
          }

      - name: Prepare build configuration
        shell: pwsh
        run: |
          if (Test-Path tools/build.example.json) {
            Copy-Item tools/build.example.json tools/build.local.json
          }

      - name: Build FL Royale
        shell: pwsh
        run: |
          python tools/build.py

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FL-Royale-APK
          path: |
            **/*.apk
          if-no-files-found: error
          retention-days: 7
```
