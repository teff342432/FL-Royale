name: Build FL Royale APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          sdkmanager "platforms;android-34" "build-tools;36.1.0" "ndk;27.3.13750724"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Check build configuration
        shell: pwsh
        run: |
          if (!(Test-Path "build.local.json")) {
            Write-Error "build.local.json is missing"
            exit 1
          }

      - name: Build APK
        shell: pwsh
        run: |
          ./tools/build_offline_app.ps1 -Python python

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FL-Royale-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7
