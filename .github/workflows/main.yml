      - name: Create build configuration
        shell: pwsh
        run: |
          Copy-Item build.example.json build.local.json

          $config = Get-Content build.local.json -Raw | ConvertFrom-Json

          $config.firstlight_cr = ""
          $config.runtime_update = "user-provided/runtime-update"
          $config.java_home = $env:JAVA_HOME
          $config.android_sdk = $env:ANDROID_HOME

          $config | ConvertTo-Json -Depth 10 | Set-Content build.local.json
jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK components
        shell: pwsh
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;36.1.0" "ndk;27.3.13750724"

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build
        shell: pwsh
        run: |
          ./tools/build_offline_app.ps1 -Python python

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FL-Royale-APK
          path: dist/*.apk
          if-no-files-found: error
