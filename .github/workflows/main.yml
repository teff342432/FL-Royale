name: Build FL Royale APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK components
        shell: pwsh
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;36.1.0" "ndk;27.3.13750724"

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build
        shell: pwsh
        run: |
          ./tools/build_offline_app.ps1 -Python python

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FL-Royale-APK
          path: dist/*.apk
          if-no-files-found: error
